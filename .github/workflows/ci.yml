name: ci

on:
  push:
    branches: [main]

  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        # 版本取自 package.json 的 packageManager（pnpm@11.7.0）

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      # 依赖已全部改为 registry semver（peerDependencies/devDependencies），
      # 不由 link: 指向兄弟目录的 deepseek-harness，无需再 checkout + build。

      - name: Install plugin dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Smoke test (snapshots + WebDAV mock)
        run: pnpm smoke
